<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💜 ARIRANG WORLD TOUR KAOHSIUNG FREEBIES 💜</title>
    <style>
        :root {
            --bts-purple: #5b3069;
            --bts-light-purple: #7b4b8d;
            --bts-bg: #f9f5fb;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --tag-bg: #f0e6f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bts-bg);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, var(--bts-purple), var(--bts-light-purple));
            color: white;
            text-align: center;
            padding: 24px 16px;
            box-shadow: 0 4px 10px rgba(91, 48, 105, 0.2);
        }

        header h1 {
            font-size: 1.3rem;
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* 日期導覽列 (Day Tabs) */
        .day-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
